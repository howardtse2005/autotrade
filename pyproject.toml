[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "1.0.0"
description = "IBKR news-sentiment + ML short-term trading bot"
requires-python = ">=3.11"
dependencies = [
  "ib_async>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.19",
  "apscheduler>=3.10",
  "exchange_calendars>=4.5",
  "yfinance>=0.2",
  "feedparser>=6.0",
  "transformers>=4.40",
  "torch>=2.2",
  "sse-starlette>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "rapidfuzz>=3.6",
  "tenacity>=8.2",
  "aiolimiter>=1.1",
  "httpx>=0.27",
  "pyarrow>=15.0",
  "joblib>=1.3",
  "tradingview-screener>=3.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "respx>=0.21", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradebot = ["web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: slow tests", "ib: needs a live IB Gateway"]

[tool.ruff]
line-length = 110
target-version = "py311"
